    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            var guard = document.getElementById('studyosStartupGuard');
            function showStartupError(details) {
                if (!guard) return;
                var archivePath = /\.zip|AppData[\/]+Local[\/]+Temp/i.test(decodeURIComponent(location.href));
                guard.innerHTML =
                    '<h1 class="startup-error">StudyOS could not load its application files.</h1>' +
                    (archivePath ? '<p><strong>This file appears to be opened from inside the ZIP archive.</strong></p>' : '') +
                    '<p>Extract the <strong>entire ZIP</strong> first. Keep <code>index.html</code> beside the <code>css</code>, <code>js</code>, <code>pages</code>, <code>modals</code>, <code>data</code>, and <code>media</code> folders, then open it again.</p>' +
                    '<p>Missing startup checks: ' + details + '</p>';
            }

            await new Promise(function(resolve){ setTimeout(resolve, 60); });
            var accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
            var checks = {
                styles: Boolean(accent),
                pages: Boolean(window.STUDYOS_PAGES && document.querySelectorAll('.page').length >= 12),
                router: typeof window.go === 'function',
                core: typeof window.initV7UI === 'function'
            };
            var missing = Object.keys(checks).filter(function(key){ return !checks[key]; });
            if (missing.length) { showStartupError(missing.join(', ')); return; }

            document.body.classList.add('studyos-assets-ready');
            try { if (window.__storageReadyPromise) await window.__storageReadyPromise; } catch (e) { console.error(e); }
            try { window.initV7UI(); } catch (e) { console.error('StudyOS UI initialization failed', e); }
            try { if (typeof window.refreshDashboard === 'function') window.refreshDashboard(); } catch (e) { console.error('Dashboard refresh failed', e); }
            try { if (typeof window.renderSystemHealth === 'function') window.renderSystemHealth(); } catch (e) { console.error('System health render failed', e); }
            try { if (typeof window.applyStudyOSUnification === 'function') window.applyStudyOSUnification(document); } catch (e) { console.error('UI unification failed', e); }
        });
    </script>
